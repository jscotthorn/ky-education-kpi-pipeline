    # school year 20192020. It is not registered. 1,680 of 1,831 Title I and
    # Not Title I rows are all zero, and 122 of 177 districts are entirely
    # zero, so a statewide 1.41 against 8.88 in 2021 is not a comparable
    # series. The parser skips that filename. Issue #66 holds whether to
    # bring the file back.
    # The historical KYRC24 file registered below stays for this pull
    # request. The datasets copy's Title I and Not Title I cells match UAT,
    # and the historical gap rows match the datasets gaps rather than the
    # historical group cells. Issue #66 holds that copy choice. Do not swap
    # it here. The UAT KYRC25 object negates some equity-gap cells. datasets
    # has no Content-MD5, so the downloader keeps the datasets object.
    - "KYRC24_OVW_Students_Taught_by_Out_of_Field_Teachers.csv"
    - url: "kyrc25"
      file: "KYRC25_OVW_Students_Taught_by_Out_of_Field_Teachers.csv"
    - url: "kyrc26"
      file: "KYRC26_OVW_Students_Taught_by_Out_of_Field_Teachers.csv"
